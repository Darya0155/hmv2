
<style>
    .login-wrapper {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
        background: #f5f7fb;
    }

    .login-card {
        width: 100%;
        max-width: 450px;
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-header h2 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        color: #1f2937;
    }

    .login-header p {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
    }

    .login-form p {
        margin-bottom: 18px;
    }

    .login-form label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
    }

    .login-form input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        background: #fff;
        transition: all 0.2s ease;
    }

    .login-form input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .login-form ul.errorlist {
        margin: 5px 0 8px;
        padding: 0;
        list-style: none;
        color: #dc2626;
        font-size: 13px;
    }

    .login-btn {
        width: 100%;
        border: none;
        padding: 13px 20px;
        margin-top: 8px;
        border-radius: 8px;
        background: #4f46e5;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .login-btn:hover {
        background: #4338ca;
        transform: translateY(-1px);
    }

    .signup-link {
        text-align: center;
        margin-top: 22px;
        font-size: 14px;
        color: #6b7280;
    }

    .signup-link a {
        color: #4f46e5;
        font-weight: 600;
        text-decoration: none;
    }

    .signup-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 576px) {
        .login-card {
            padding: 28px 20px;
        }

        .login-header h2 {
            font-size: 24px;
        }
    }
</style>

<div class="login-wrapper">
<div class="login-card">

    <div class="login-header">
        <h2>Welcome Back 👋</h2>
        <p>Login to access your account</p>
    </div>

    <form method="POST" class="login-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <div class="signup-link">
        Don't have an account?
        <a href="{% url 'signup' %}">Create an account</a>
    </div>

</div>


</div>
